name: Sync CURRENT STATE

on:
  push:
    paths:
      - ".github/workflows/sync-current-state.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-current-state
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Fetch and archive CURRENT STATE
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="https://bmttucyrhaolzalijjmp.supabase.co/functions/v1/main-god-current-state"
          curl --fail --silent --show-error --location "$SOURCE_URL" --output current-state.json.tmp
          jq -e 'type == "object" and (.version | type == "number") and (.schema_version != null) and (.state != null)' current-state.json.tmp >/dev/null

          VERSION="$(jq -r '.version' current-state.json.tmp)"
          mkdir -p current-state/sections

          # Normalize the compact API response into readable nested JSON.
          # This changes formatting only; values and object structure remain unchanged.
          jq '.' current-state.json.tmp > current-state.json
          jq '.' current-state.json.tmp > current-state/latest.json
          jq '.' current-state.json.tmp > "current-state/v${VERSION}.json"

          while IFS= read -r KEY; do
            SAFE_KEY="$(printf '%s' "$KEY" | jq -sRr @uri)"
            jq --arg key "$KEY" '{
              authority,
              usage,
              schema_version,
              version,
              updated_at,
              section: $key,
              state: {($key): .state[$key]}
            }' current-state.json.tmp > "current-state/sections/${SAFE_KEY}.json"
          done < <(jq -r '.state | keys[]' current-state.json.tmp)

          jq '{
            authority: "AI主神資料庫 CURRENT STATE｜GitHub verification mirror",
            version,
            schema_version,
            updated_at,
            latest: "current-state/latest.json",
            versioned: ("current-state/v" + (.version | tostring) + ".json"),
            sections: (
              .state
              | keys
              | map({
                  key: .,
                  value: ("current-state/sections/" + (. | @uri) + ".json")
                })
              | from_entries
            ),
            rule: "ChatGPT should read this manifest first, use the highest archived version, then open only the relevant section files when possible. Older conversation data must not overwrite the archived version."
          }' current-state.json.tmp > current-state/manifest.json

          rm current-state.json.tmp

      - name: Commit updated mirror
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- current-state.json current-state)" ]]; then
            echo "CURRENT STATE is already up to date."
            exit 0
          fi
          git config user.name "main-god-mirror-bot"
          git config user.email "main-god-mirror-bot@users.noreply.github.com"
          git add current-state.json current-state
          VERSION="$(jq -r '.version' current-state/latest.json)"
          git commit -m "chore: archive CURRENT STATE v${VERSION}"
          git push
